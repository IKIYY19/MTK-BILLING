<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <link rel="apple-touch-icon" href="/vite.svg" />
        <meta name="apple-mobile-web-app-title" content="MTK Billing" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <meta name="theme-color" content="#edf2f0" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>MikroTik Billing</title>
    </head>
    <body>
        <!--
        THESIS: An ISP operations desk makes billing and access status legible at a glance; no floating neon metric tiles.
        OWN-WORLD: Cool mineral work surfaces, dark ink navigation, ruled registers, and restrained teal, orange, and status marks.
        STORY: Operators scan collections, account exceptions, and active access, then jump directly into the task.
        FIRST VIEWPORT: A plain page title and actions; one ruled four-value summary; a seven-day revenue chart beside a recent-payment register.
        FORM: A telecom field-service docket, paired with a single-page shift handoff register; concept seeds 32b4e78f and 7e360a01.
        -->
        <div id="root"></div>
        <script>
          // Some captive-portal browsers expose localStorage/sessionStorage as
          // null and throw on access. Provide an in-memory fallback so the app
          // (and i18next) can boot without storage.
          (function () {
            function memoryStore() {
              var data = {};
              return {
                getItem: function (key) {
                  return Object.prototype.hasOwnProperty.call(data, key) ? data[key] : null;
                },
                setItem: function (key, value) { data[key] = String(value); },
                removeItem: function (key) { delete data[key]; },
                clear: function () { data = {}; },
                key: function (index) { return Object.keys(data)[index] || null; },
                get length() { return Object.keys(data).length; }
              };
            }
            function usable(store) {
              try {
                store.getItem('__storage_test__');
                store.removeItem('__storage_test__');
                return true;
              } catch (e) { return false; }
            }
            ['localStorage', 'sessionStorage'].forEach(function (name) {
              var store;
              try { store = window[name]; } catch (e) { store = null; }
              if (!store || !usable(store)) {
                try {
                  Object.defineProperty(window, name, {
                    value: memoryStore(), configurable: true, writable: false
                  });
                } catch (e) {
                  window[name] = memoryStore();
                }
              }
            });
          })();
        </script>
        <script>
          window.addEventListener('error', function (event) {
            navigator.sendBeacon('/api/client-error', JSON.stringify({
              message: event.message,
              stack: event.error && event.error.stack,
              url: location.href,
            }));
          });
          window.addEventListener('unhandledrejection', function (event) {
            navigator.sendBeacon('/api/client-error', JSON.stringify({
              message: String(event.reason && event.reason.message || event.reason),
              stack: event.reason && event.reason.stack,
              url: location.href,
            }));
          });
        </script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
