<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giraffe Hotspot · Voucher</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f0e;color:#f4f4f5;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,400px);padding:30px;border:1px solid #2e3a33;border-radius:18px;background:#121814}
    .logo{width:46px;height:46px;margin:0 auto 12px;border-radius:13px;background:#facc15;color:#0b0f0e;display:grid;place-items:center;font-size:22px;font-weight:800}
    h1{margin:0 0 6px;font-size:22px;color:#facc15;text-align:center}
    p{margin:0 0 20px;color:#a9b5ad;font-size:13px;text-align:center}
    label{display:block;margin-bottom:12px;font-size:12px;color:#d4d4d8}
    input{width:100%;padding:11px 12px;margin-top:6px;border:1px solid #334039;border-radius:9px;background:#0b0f0e;color:#f4f4f5;font-size:14px;letter-spacing:1px}
    button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:9px;background:#facc15;color:#0b0f0e;font-size:14px;font-weight:700;cursor:pointer}
    a{display:inline-block;margin-top:16px;color:#facc15;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="logo">G</div>
    <h1>Giraffe Hotspot</h1>
    <p>Enter your voucher code. Just the code — no username or password needed.</p>
    <form id="voucher-form">
      <label>Voucher code
        <input id="voucher-code" name="code" autocomplete="off" placeholder="e.g. GH-ABCD2345" required>
      </label>
      <button type="submit">Get online</button>
    </form>
    <a href="login.html">Back to internet packages</a>
  </main>
  <script>
    (function () {
      var form = document.getElementById('voucher-form');
      var input = document.getElementById('voucher-code');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var code = (input.value || '').trim().toUpperCase();
        if (!code) { return; }
        var params = new URLSearchParams(window.location.search);
        var target = new URL('http://192.168.100.8/hotspot');
        target.searchParams.set('router_id', params.get('router_id') || 'e0bfcfd8-8b34-4e37-88d5-d484e90d628a');
        target.searchParams.set('brand', 'Giraffe Hotspot');
        target.searchParams.set('welcome', 'Welcome to Giraffe Hotspot. Your voucher is being verified.');
        target.searchParams.set('code', code);
        window.location.href = target.toString();
      });
    })();
  </script>
</body>
</html>
