<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voucher access</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#f4f4f5;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,400px);padding:30px;border:1px solid #3f3f46;border-radius:16px;background:#18181b}
    h1{margin:0 0 6px;font-size:22px}
    p{margin:0 0 20px;color:#a1a1aa;font-size:13px}
    label{display:block;margin-bottom:12px;font-size:12px;color:#d4d4d8}
    input{width:100%;padding:11px 12px;margin-top:6px;border:1px solid #3f3f46;border-radius:9px;background:#09090b;color:#f4f4f5;font-size:14px}
    button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
    a{display:inline-block;margin-top:16px;color:#a5b4fc;font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>Use a voucher</h1>
    <p>Enter the access code issued to you. Charges are already paid.</p>
    <form method="post" action="$(link-login-only)">
      <input type="hidden" name="dst" value="$(link-orig)">
      <label>Access code / username
        <input name="username" autocomplete="username" required>
      </label>
      <label>PIN / password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Connect</button>
    </form>
    <a href="login.html">Back to internet packages</a>
  </main>
</body>
</html>
