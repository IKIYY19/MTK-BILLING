<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Wi-Fi access</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#f4f4f5;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:30px;border:1px solid #3f3f46;border-radius:16px;background:#18181b;text-align:center}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 18px;color:#d4d4d8;font-size:14px}
    a{display:inline-block;margin-top:18px;color:#a5b4fc;font-size:13px}
    .spin{width:26px;height:26px;margin:0 auto 18px;border:3px solid #3f3f46;border-top-color:#818cf8;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="spin"></div>
    <h1>Wi-Fi access</h1>
    <p>Opening the internet packages page…</p>
    <form id="portal-handoff" action="http://192.168.100.8:5173/hotspot" method="get">
      <input type="hidden" name="router_id" value="e0bfcfd8-8b34-4e37-88d5-d484e90d628a">
      <input type="hidden" name="brand" value="ISP Wi-Fi">
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="link_login_only" value="$(link-login-only)">
      <input type="hidden" name="original_url" value="$(link-orig)">
      <noscript><button type="submit">Continue to packages</button></noscript>
    </form>
    <a href="voucher.html">Have a voucher or access code?</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var fields = ["router_id", "brand", "mac", "ip", "link_login_only", "original_url"];
      fields.forEach(function (key) {
        var value = params.get(key) || params.get(key.replace(/_/g, "-"));
        var input = document.querySelector('input[name="' + key + '"]');
        if (value && input && input.value.indexOf("$(") === 0) { input.value = value; }
      });
      setTimeout(function () { document.getElementById("portal-handoff").submit(); }, 2500);
    })();
  </script>
</body>
</html>
