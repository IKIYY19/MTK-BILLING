# FreeRADIUS Clients Configuration
# This file defines which NAS (Network Access Server) devices can send RADIUS requests
# Each MikroTik router should be added as a client

# This client is replaced at build time by the RADIUS container environment.
client localhost {
    ipaddr = 127.0.0.1
    secret = ${ENV:RADIUS_SECRET}
    require_message_authenticator = no
    nas_type = "other"
}

# Add each MikroTik router here or manage clients through the nas table.
