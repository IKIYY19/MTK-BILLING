services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mikrotik_config_builder}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./radius/radius_schema.sql:/docker-entrypoint-initdb.d/radius_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mikrotik_config_builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile.radius
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      RADIUS_DB_NAME: ${RADIUS_DB_NAME:-mikrotik_config_builder}
      RADIUS_SECRET: ${RADIUS_SECRET}
      RUN_RADIUS_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mikrotik_config_builder}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RADIUS_SERVER: ${RADIUS_SERVER:-radius}
      RADIUS_SECRET: ${RADIUS_SECRET}
      ENABLE_ROUTER_CONNECTIVITY: ${ENABLE_ROUTER_CONNECTIVITY:-true}
      ENABLE_MONITORING_API: ${ENABLE_MONITORING_API:-true}
      TR069_ACS_URL: ${TR069_ACS_URL:-}
      TR069_NBI_URL: ${TR069_NBI_URL:-http://genieacs:7557}
      DNS_ADBLOCK_PUBLIC_BASE_URL: ${DNS_ADBLOCK_PUBLIC_BASE_URL:-}
      DNS_ADBLOCK_FEED_SECRET: ${DNS_ADBLOCK_FEED_SECRET:-}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-}
      WG_TUNNEL_SUBNET: ${WG_TUNNEL_SUBNET:-10.200.0}
      WG_TUNNEL_PORT: ${WG_TUNNEL_PORT:-51820}
      WG_INTERFACE: ${WG_INTERFACE:-wg-billing}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-25}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
    ports:
      - "5000:5000"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - wg-config:/etc/wireguard
    depends_on:
      postgres:
        condition: service_healthy
      radius:
        condition: service_started
      genieacs:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: mtk-tr069-mongo
    volumes:
      - tr069-mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: mtk-tr069-redis
    restart: unless-stopped

  genieacs:
    image: drumsergio/genieacs:latest
    container_name: mtk-tr069-genieacs
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
      GENIEACS_REDIS_HOST: redis
      GENIEACS_REDIS_PORT: 6379
      GENIEACS_CWMP_INTERFACE: 0.0.0.0
      GENIEACS_NBI_INTERFACE: 0.0.0.0
      GENIEACS_FS_INTERFACE: 0.0.0.0
      GENIEACS_UI_INTERFACE: 0.0.0.0
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET:-change-me}
    ports:
      - "17547:7547"
      - "17557:7557"
      - "17567:7567"
      - "13000:3000"
    volumes:
      - tr069-firmware:/opt/genieacs/firmware
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  wg-config:
  tr069-mongo-data:
  tr069-firmware:
