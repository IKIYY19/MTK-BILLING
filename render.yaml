services:
  - type: web
    name: mikrotik-billing
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: mikrotik-billing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: mikrotik-billing
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: mikrotik-billing
          envVarKey: RENDER_EXTERNAL_URL
      - key: RADIUS_SERVER
        sync: false
      - key: RADIUS_SECRET
        sync: false
      - key: ENABLE_ROUTER_CONNECTIVITY
        value: "true"
      - key: ENABLE_MONITORING_API
        value: "true"

databases:
  - name: mikrotik-billing-db
    databaseName: mikrotik_config_builder
    user: mikrotik
